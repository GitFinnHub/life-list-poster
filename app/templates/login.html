<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>A Life List</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'EB Garamond', serif; background: #f4efe3; color: #2b2420; max-width: 420px; margin: 100px auto; padding: 0 20px; text-align: center; line-height: 1.5; }
  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
  input[type=password] { width: 100%; box-sizing: border-box; padding: 10px; font-family: inherit; font-size: 1rem; border: 1px solid #b8a47e; background: transparent; color: inherit; margin-top: 20px; text-align: center; }
  button { margin-top: 20px; padding: 12px 28px; background: #2b2420; color: #f4efe3; border: none; font-family: inherit; font-size: 1rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
  button:hover { background: #4a4036; }
  .error { color: #a33; margin-top: 16px; }
</style>
</head>
<body>
  <h1>A Life List</h1>
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <input type="password" name="password" placeholder="Password" autofocus required>
    <br>
    <button type="submit">Enter</button>
  </form>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
</body>
</html>
