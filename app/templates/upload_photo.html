<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Upload a photo — {{ common_name }}</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'EB Garamond', serif; background: #f4efe3; color: #2b2420; max-width: 480px; margin: 80px auto; padding: 0 20px; line-height: 1.5; }
  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 600; letter-spacing: 1px; margin-bottom: 4px; }
  p.hint { font-style: italic; color: #6b5e4e; margin-top: 0; }
  input[type=file] { margin-top: 20px; display: block; }
  button { margin-top: 24px; padding: 12px 28px; background: #2b2420; color: #f4efe3; border: none; font-family: inherit; font-size: 1rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
  button:hover { background: #4a4036; }
  a.back { display: inline-block; margin-top: 20px; color: #6b5e4e; }
  .error { color: #a33; margin-top: 16px; padding: 10px; border: 1px solid #a33; }
</style>
</head>
<body>
  <h1>Upload a photo of {{ common_name }}</h1>
  <p class="hint">{{ hint }}</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="{{ action }}" enctype="multipart/form-data">
    <input type="file" name="photo" accept="image/*" required autofocus>
    <button type="submit">Upload</button>
  </form>
  <a class="back" href="{{ back_url }}">&larr; Back</a>
</body>
</html>
